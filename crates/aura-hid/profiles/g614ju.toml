name = "ASUS ROG Strix G614JU"
vid = 0x0b05
pid = 0x19b6
keyboard_default = "#ffffff"

# Packets that return the laptop to its saved built-in mode (static, 0x41 white).
restore = [
  [0x5d, 0xb3, 0x00, 0x00, 0x41, 0x41, 0x41, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00],
  [0x5d, 0xb5],
  [0x5d, 0xb4],
]

# Zoned direct frame, streamed every ~50 ms. See docs/protocol.md.
[packet]
len = 64
init = [0x5d, 0xbc]
header = [0x5d, 0xbc, 0x01, 0x01, 0x04]

[[leds]]
name = "key1"
group = "keys"
offset = 9

